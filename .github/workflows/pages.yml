# SPDX-License-Identifier: GPL-3.0-only
# The site on GitHub Pages, for the latest release: a landing page, the browser emulator (the same code as the
# firmware), the web installer (with the release's package), the manual, and the source as a tarball (the GPL's
# "whoever gets the firmware gets the source"). It runs when a release is made, or by hand.
# In a fork: Settings > Pages > Source: GitHub Actions, then run it.
name: Pages
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: The latest release
        run: |
          TAG=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: ./.github/actions/setup
      - name: Its package
        run: mkdir -p build && gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "lcd4-$VERSION.fwsc" --dir build
      - name: The browser emulator
        run: EN_VERSION="$VERSION" sh web/emu/build.sh
      - name: The site
        run: LCD4_REPO="https://github.com/$GITHUB_REPOSITORY" python3 tools/make_pages.py "build/lcd4-$VERSION.fwsc" "$VERSION" site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
